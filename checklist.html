<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>小尾巴</title>

<meta name="theme-color" content="#2563eb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="小尾巴">
<meta name="mobile-web-app-capable" content="yes">

<!-- ⭐ 這就是你的 icon -->
<link rel="apple-touch-icon" href="icon.png">

<style>
body{
  font-family:-apple-system,sans-serif;
  background:#f4f7fb;
  padding:20px;
}

h1{text-align:center;}

details{
  background:#fff;
  border-radius:16px;
  padding:10px 15px;
  margin-bottom:12px;
  box-shadow:0 4px 10px rgba(0,0,0,0.08);
}

summary{
  display:flex;
  align-items:center;
  gap:10px;
  cursor:pointer;
  font-weight:bold;
}

.items{margin-top:10px;}
.items label{
  display:flex;
  gap:10px;
  padding:6px 0;
}

.checked span{
  text-decoration:line-through;
  color:#999;
}
</style>
</head>

<body>

<h1>🐯 小尾巴</h1>

<!-- 重要物品 -->
<details open>
<summary><input type="checkbox" class="group"> 重要物品</summary>
<div class="items">
<label><input type="checkbox"> <span>護照</span></label>
<label><input type="checkbox"> <span>日文駕照翻譯本、台灣駕照</span></label>
<label><input type="checkbox"> <span>現金</span></label>
</div>
</details>

<!-- 清潔 -->
<details>
<summary><input type="checkbox" class="group"> 清潔</summary>
<div class="items">
<label><input type="checkbox"> <span>卸妝油</span></label>
<label><input type="checkbox"> <span>洗面乳</span></label>
<label><input type="checkbox"> <span>洗髮精</span></label>
<label><input type="checkbox"> <span>護髮膜</span></label>
<label><input type="checkbox"> <span>快乾擦髮巾</span></label>
</div>
</details>

<!-- 保養 -->
<details>
<summary><input type="checkbox" class="group"> 保養品、底妝</summary>
<div class="items">
<label><input type="checkbox"> <span>前導精華</span></label>
<label><input type="checkbox"> <span>痘膚潤</span></label>
<label><input type="checkbox"> <span>痘痘藥</span></label>
<label><input type="checkbox"> <span>化妝水</span></label>
<label><input type="checkbox"> <span>眼霜</span></label>
<label><input type="checkbox"> <span>保濕精華液</span></label>
<label><input type="checkbox"> <span>面霜</span></label>
<label><input type="checkbox"> <span>擦拭行化妝水</span></label>
<label><input type="checkbox"> <span>化妝棉</span></label>
<label><input type="checkbox"> <span>防曬</span></label>
<label><input type="checkbox"> <span>CC霜</span></label>
<label><input type="checkbox"> <span>妝前霜</span></label>
<label><input type="checkbox"> <span>蜜粉</span></label>
<label><input type="checkbox"> <span>多效精華液</span></label>
<label><input type="checkbox"> <span>身體乳液</span></label>
</div>
</details>

<!-- 生活 -->
<details>
<summary><input type="checkbox" class="group"> 生活物品</summary>
<div class="items">
<label><input type="checkbox"> <span>牙刷、牙膏</span></label>
<label><input type="checkbox"> <span>牙線棒</span></label>
<label><input type="checkbox"> <span>棉花棒</span></label>
<label><input type="checkbox"> <span>濕紙巾</span></label>
<label><input type="checkbox"> <span>暈車藥</span></label>
<label><input type="checkbox"> <span>暖暖包</span></label>
<label><input type="checkbox"> <span>鯊魚夾</span></label>
<label><input type="checkbox"> <span>瀏海貼</span></label>
<label><input type="checkbox"> <span>口罩</span></label>
<label><input type="checkbox"> <span>袖珍面紙</span></label>
<label><input type="checkbox"> <span>購物袋</span></label>
<label><input type="checkbox"> <span>垃圾袋</span></label>
<label><input type="checkbox"> <span>凡士林</span></label>
<label><input type="checkbox"> <span>眼藥水</span></label>
<label><input type="checkbox"> <span>眼鏡</span></label>
</div>
</details>

<!-- 其他 -->
<details>
<summary><input type="checkbox" class="group"> 其他</summary>
<div class="items">
<label><input type="checkbox"> <span>行動電源</span></label>
<label><input type="checkbox"> <span>酒精</span></label>
<label><input type="checkbox"> <span>耳機</span></label>
<label><input type="checkbox"> <span>充電頭、充電線</span></label>
<label><input type="checkbox"> <span>藥品</span></label>
</div>
</details>

<script>
const STORAGE_KEY="tail-checklist";

const items=document.querySelectorAll(".items input");
const groups=document.querySelectorAll(".group");
const state=JSON.parse(localStorage.getItem(STORAGE_KEY)||"{}");

// 初始化
items.forEach(cb=>{
  const key=cb.nextElementSibling.innerText;
  if(state[key]){
    cb.checked=true;
    cb.closest("label").classList.add("checked");
  }
});

// 子項目
items.forEach(cb=>{
  cb.addEventListener("change",()=>{
    const label=cb.closest("label");
    label.classList.toggle("checked",cb.checked);

    const key=cb.nextElementSibling.innerText;
    state[key]=cb.checked;
    localStorage.setItem(STORAGE_KEY,JSON.stringify(state));

    const box=cb.closest("details");
    const all=box.querySelectorAll(".items input");
    const done=box.querySelectorAll(".items input:checked");

    const group=box.querySelector(".group");
    group.checked=all.length===done.length;

    if(group.checked){
      box.removeAttribute("open");
    }
  });
});

// 上層
groups.forEach(g=>{
  g.addEventListener("change",()=>{
    const box=g.closest("details");
    const all=box.querySelectorAll(".items input");

    all.forEach(i=>{
      i.checked=g.checked;
      i.closest("label").classList.toggle("checked",g.checked);

      const key=i.nextElementSibling.innerText;
      state[key]=g.checked;
    });

    localStorage.setItem(STORAGE_KEY,JSON.stringify(state));

    if(g.checked){
      box.removeAttribute("open");
    }else{
      box.setAttribute("open","");
    }
  });
});
</script>

</body>
</html>
